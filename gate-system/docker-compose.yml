name: gate-system

services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fingerprints-service
      - payment-service
      - hardware-service
      - access-control-service
      - dashboard
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # LAN-accessible for the Pi hardware-service (firewall this to your LAN only).
    ports:
      - "${REDIS_LAN_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes", "--bind", "0.0.0.0"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  fingerprints-service:
    build:
      context: .
      dockerfile: ./services/fingerprints-service/Dockerfile
    env_file:
      - ./services/fingerprints-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  payment-service:
    build:
      context: .
      dockerfile: ./services/payment-service/Dockerfile
    env_file:
      - ./services/payment-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  hardware-service:
    build:
      context: .
      dockerfile: ./services/hardware-service/Dockerfile
    env_file:
      - ./services/hardware-service/.env
    depends_on:
      redis:
        condition: service_healthy
    # On real Pi you might want: privileged: true
    restart: unless-stopped

  access-control-service:
    build:
      context: .
      dockerfile: ./services/access-control-service/Dockerfile
    env_file:
      - ./services/access-control-service/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build: ./apps/dashboard
    env_file:
      - ./apps/dashboard/.env
    restart: unless-stopped

  # Named Cloudflare Tunnel (Zero Trust token). Enable with:
  #   CLOUDFLARE_TUNNEL_TOKEN=... docker compose --profile tunnel up -d
  # Set payment-service PUBLIC_BASE_URL to https://<your-hostname> first.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - nginx
    restart: unless-stopped

  # Ephemeral trycloudflare.com URL for a one-shot callback smoke test.
  #   docker compose --profile quick-tunnel up cloudflared-quick
  # Copy the printed https://….trycloudflare.com URL into PUBLIC_BASE_URL.
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    profiles: ["quick-tunnel"]
    command: tunnel --no-autoupdate --url http://nginx:80
    depends_on:
      - nginx
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

