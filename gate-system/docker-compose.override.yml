# Auto-merged when you run: docker compose up
# (Not used when you pass explicit -f files, e.g. edge/server/pi compose.)
#
# Mounts local source into containers and enables live reload:
#   - Python: uvicorn --reload
#   - Dashboard: Vite dev server
#
# Disable live reload (production-like images):
#   docker compose -f docker-compose.yml up --build

services:
  nginx:
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  chip-service:
    volumes:
      - ./services/chip-service:/app
      - ./shared/py:/app/shared/py
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app",
        "--reload-dir",
        "/app/shared/py",
      ]

  payment-service:
    volumes:
      - ./services/payment-service:/app
      - ./shared/py:/app/shared/py
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app",
        "--reload-dir",
        "/app/shared/py",
      ]

  hardware-service:
    volumes:
      - ./services/hardware-service:/app
      - ./shared/py:/app/shared/py
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app",
        "--reload-dir",
        "/app/shared/py",
      ]

  access-control-service:
    volumes:
      - ./services/access-control-service:/app
      - ./shared/py:/app/shared/py
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app",
        "--reload-dir",
        "/app/shared/py",
      ]

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile.dev
    volumes:
      - ./apps/dashboard:/app
      - dashboard_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_DEV_PORT: "80"
      VITE_HMR_CLIENT_PORT: "80"
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "80"]

volumes:
  dashboard_node_modules:
