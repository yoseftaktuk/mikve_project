# Auto-merged when you run: docker compose up
# (Not used when you pass explicit -f files, e.g. edge/server/pi compose.)
#
# Mounts local source into containers and enables live reload:
#   - Python: uvicorn --reload
#   - Frontend: Vite dev server
#
# Disable live reload (production-like images):
#   docker compose -f docker-compose.yml up --build

services:
  nginx:
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  fingerprints-service:
    volumes:
      - ./backend/fingerprints-service:/app
      - ./shared/py:/app/shared/py
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app",
        "--reload-dir",
        "/app/shared/py",
      ]

  payment-service:
    volumes:
      - ./backend/payment-service:/app
      - ./shared/py:/app/shared/py
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app",
        "--reload-dir",
        "/app/shared/py",
      ]

  hardware-service:
    volumes:
      - ./backend/hardware-service:/app
      - ./shared/py:/app/shared/py
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app",
        "--reload-dir",
        "/app/shared/py",
      ]

  access-control-service:
    volumes:
      - ./backend/access-control-service:/app
      - ./shared/py:/app/shared/py
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app",
        "--reload-dir",
        "/app/shared/py",
      ]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      VITE_DEV_PORT: "80"
      VITE_HMR_CLIENT_PORT: "80"
    # Named volume can lag behind package.json; sync deps before Vite starts.
    command:
      [
        "sh",
        "-c",
        "npm ci && npm run dev -- --host 0.0.0.0 --port 80",
      ]

  pgadmin:
    image: dpage/pgadmin4:latest
    profiles: ["pgadmin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  frontend_node_modules:
